version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-southeast-2
    ECR_REPOSITORY_URI: 728638313200.dkr.ecr.ap-southeast-2.amazonaws.com/aws-assignment-5-app

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin 728638313200.dkr.ecr.ap-southeast-2.amazonaws.com
  build:
    commands:
      - docker build -t "$ECR_REPOSITORY_URI:latest" .
  post_build:
    commands:
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)
      - docker tag "$ECR_REPOSITORY_URI:latest" "$ECR_REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$ECR_REPOSITORY_URI:latest"
